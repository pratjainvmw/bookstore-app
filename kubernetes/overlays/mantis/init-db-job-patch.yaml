apiVersion: batch/v1
kind: Job
metadata:
  name: init-database
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: harbor.lab.worker-node.com/library/postgres:14-alpine
        - name: run-migrations
          image: harbor.lab.worker-node.com/library/postgres:14-alpine
        - name: wait-for-minio
          image: harbor.lab.worker-node.com/library/postgres:14-alpine
      containers:
        - name: seed-images
          image: harbor.lab.worker-node.com/bookstore/app:latest
